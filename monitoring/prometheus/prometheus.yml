# Gidede API — Prometheus Configuration
# Фаза 4.E.7: Нагрузочное тестирование и мониторинг

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "gidede"
    environment: "development"

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "gidede-api"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "host.docker.internal:3030"
        labels:
          service: "gidede-api"
          team: "gidede"
