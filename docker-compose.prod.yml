# Gidede — Docker Compose для Production
# SSL termination через nginx, reverse proxy, health checks

services:
  # ===== Nginx (Reverse Proxy + SSL Termination) =====
  nginx:
    image: nginx:alpine
    container_name: gidede-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gidede-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===== Frontend (Next.js 16 Production) =====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gidede-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gidede-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===== Backend (FastAPI + Uvicorn) =====
  backend:
    build:
      context: ./mini-services/api-service
      dockerfile: Dockerfile
    container_name: gidede-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql+asyncpg://gidede:${DB_PASSWORD:-gidede_prod_secure}@postgres:5432/gidede
      - REDIS_URL=redis://:${REDIS_PASSWORD:-gidede_redis_secure}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER:-auto}
      - AI_CACHE_ENABLED=${AI_CACHE_ENABLED:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://gidede.app,https://www.gidede.app}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - RAG_ENABLED=${RAG_ENABLED:-true}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gidede-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3030/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===== PostgreSQL + pgvector =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gidede-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gidede}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
      POSTGRES_DB: ${DB_NAME:-gidede}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gidede-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gidede}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Не открываем порт наружу в production — доступ только через внутреннюю сеть
    # ports:
    #   - "5432:5432"

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: gidede-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-gidede_redis_secure}
    volumes:
      - redis_data:/data
    networks:
      - gidede-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gidede_redis_secure}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Не открываем порт наружу в production — доступ только через внутреннюю сеть
    # ports:
    #   - "6379:6379"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  gidede-network:
    driver: bridge
