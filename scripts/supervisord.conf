; =============================================================================
; Gidede — Supervisord Configuration (All-in-One Container)
; =============================================================================
; Управляет 4 процессами внутри одного контейнера:
;   1. PostgreSQL — база данных
;   2. Redis — кэш и pub-sub
;   3. Backend — FastAPI (uvicorn)
;   4. Frontend — Next.js (standalone)
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:redis]
command=/usr/bin/redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:backend]
command=/usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 3030 --workers 2
directory=/app/backend
user=root
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1",PYTHONPATH="/app/backend"

[program:frontend]
command=/usr/local/bin/bun /app/frontend/server.js
directory=/app/frontend
user=root
autostart=true
autorestart=true
priority=40
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",PORT="3000",HOSTNAME="0.0.0.0"
